{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
  - name: main
    namespace: gateway
  hostnames:
  - {{ .Values.route.host | quote }}
  rules:
  - backendRefs:
    - name: {{ .Release.Name }}
      port: 80
{{- end }}
