name: validate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Lint chart
        run: |
          for env in dev prod; do
            helm lint charts/web -f charts/web/values-$env.yaml
          done

      - name: Validate manifests
        run: |
          SCHEMAS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for env in dev prod; do
            echo "--- $env ---"
            helm template web-$env charts/web -f charts/web/values-$env.yaml \
              | kubeconform -strict -summary -schema-location default -schema-location "$SCHEMAS"
          done
          echo "--- plain manifests ---"
          kubeconform -strict -summary -schema-location default -schema-location "$SCHEMAS" apps/ argo/
